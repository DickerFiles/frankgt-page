name: Deploy demo

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: [self-hosted, docker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t frank:latest .

      - name: Deploy
        run: |
          mkdir -p /srv/docker/stacks/apps/frank
          cp docker-compose.yml /srv/docker/stacks/apps/frank/docker-compose.yml
          cd /srv/docker/stacks/apps/frank
          docker compose up -d
