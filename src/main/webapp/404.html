<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>404 - Lost in the Void</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#05070a",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Space Grotesk', sans-serif;
        }
        .glitch-text {
            text-shadow: 3px 0 #135bec, -3px 0 #ff00c1;
        }
        .cosmic-bg {
            background: radial-gradient(circle at center, #0a1120 0%, #05070a 100%);
        }
        .star-field {
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
        }
        .glow-pulse {
            box-shadow: 0 0 20px rgba(19, 91, 236, 0.5);
        }
    </style>
</head>

<body class="bg-background-dark text-white overflow-hidden">
    <div class="relative flex h-screen w-full flex-col cosmic-bg">
        <div class="absolute inset-0 star-field opacity-40 pointer-events-none"></div>
        <div
            class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1464802686167-b939a67e0621?auto=format&amp;fit=crop&amp;q=80&amp;w=2000')] bg-cover bg-center opacity-25 mix-blend-screen pointer-events-none">
        </div>
        <div class="relative flex h-full w-full flex-col items-center justify-center z-10">
            <div class="flex flex-col items-center max-w-2xl px-6 text-center mb-32">
                <h1
                    class="text-white tracking-tighter text-[140px] md:text-[220px] font-bold leading-none glitch-text font-display opacity-95">
                    404
                </h1>
                <div class="space-y-4 mb-10">
                    <h2 class="text-white/90 tracking-[0.3em] text-xl md:text-2xl font-semibold uppercase font-display">
                        Lost in the Void
                    </h2>
                    <p
                        class="text-white/60 text-lg md:text-xl font-normal leading-relaxed max-w-lg mx-auto font-display">
                        estas en lugares alos que mi codigo no ha llegado aun. vuelve ala pagina principal
                    </p>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
